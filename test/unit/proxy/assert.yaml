apiVersion: apps/v1
kind: Deployment
metadata:
  name: source-controller
spec:
  template:
    spec:
      (containers[?name == 'manager'] | [0]):
        (env[?name == 'HTTP_PROXY'] | [0].value): http://proxy.example.com:3128
        (env[?name == 'HTTPS_PROXY'] | [0].value): http://proxy.example.com:3128
        (env[?name == 'NO_PROXY'] | [0].value): .cluster.local.,.cluster.local,.svc
        # The upstream variables are kept.
        (env[?name == 'RUNTIME_NAMESPACE'] | length(@)): 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-controller
spec:
  template:
    spec:
      (containers[?name == 'manager'] | [0]):
        (env[?name == 'HTTPS_PROXY'] | [0].value): http://proxy.example.com:3128
