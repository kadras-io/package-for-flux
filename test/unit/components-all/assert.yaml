apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-reflector-controller
spec:
  template:
    spec:
      priorityClassName: system-cluster-critical
      automountServiceAccountToken: false
      (containers[?name == 'manager'] | [0]):
        (contains(args, '--events-addr=http://notification-controller.flux-system.svc.cluster.local./')): true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-automation-controller
spec:
  template:
    spec:
      priorityClassName: system-cluster-critical
      automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: source-watcher
spec:
  template:
    spec:
      priorityClassName: system-cluster-critical
      automountServiceAccountToken: false
      (containers[?name == 'manager'] | [0]):
        (contains(args, '--events-addr=http://notification-controller.flux-system.svc.cluster.local./')): true
---
apiVersion: v1
kind: Service
metadata:
  name: source-watcher
  namespace: flux-system
---
apiVersion: apiextensions.k8s.io/v1
