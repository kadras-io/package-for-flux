apiVersion: apps/v1
kind: Deployment
metadata:
  name: source-controller
spec:
  template:
    spec:
      (containers[?name == 'manager'] | [0]):
        # Without the notification controller, the events aren't sent.
        (args[?starts_with(@, '--events-addr')] | length(@)): 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kustomize-controller
spec:
  template:
    spec:
      (containers[?name == 'manager'] | [0]):
        (args[?starts_with(@, '--events-addr')] | length(@)): 0
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-crd-controller
subjects:
- name: kustomize-controller
- name: source-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-cluster-reconciler
subjects:
- name: kustomize-controller
