apiVersion: v1
kind: Namespace
metadata:
  name: flux-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
  annotations:
    # Uninstalling the package keeps the namespace and the Flux resources in it,
    # and installing it again adopts them.
    kapp.k14s.io/delete-strategy: orphan
    kapp.k14s.io/create-strategy: fallback-on-update
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kustomizations.kustomize.toolkit.fluxcd.io
  annotations:
    kapp.k14s.io/delete-strategy: orphan
    kapp.k14s.io/create-strategy: fallback-on-update
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: helmreleases.helm.toolkit.fluxcd.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: source-controller
  namespace: flux-system
spec:
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      priorityClassName: system-cluster-critical
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: canonical-registry-credentials
      (volumes[?name == 'kube-api-access'] | length(@)): 1
      (containers[?name == 'manager'] | [0]):
        args:
        - --events-addr=http://notification-controller.flux-system.svc.cluster.local./
        - --watch-all-namespaces
        - --log-level=info
        - --log-encoding=json
        - --enable-leader-election
        - --storage-path=/data
        - --storage-adv-addr=source-controller.$(RUNTIME_NAMESPACE).svc.cluster.local.
        (volumeMounts[?name == 'kube-api-access'] | length(@)): 1
        (env[?name == 'HTTPS_PROXY'] | length(@)): 0
        (env[?name == 'SSL_CERT_DIR'] | length(@)): 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kustomize-controller
  namespace: flux-system
spec:
  template:
    spec:
      priorityClassName: system-cluster-critical
      automountServiceAccountToken: false
      (containers[?name == 'manager'] | [0]):
        (contains(args, '--events-addr=http://notification-controller.flux-system.svc.cluster.local./')): true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helm-controller
  namespace: flux-system
spec:
  template:
    spec:
      priorityClassName: system-cluster-critical
      automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-controller
  namespace: flux-system
spec:
  template:
    spec:
      # Upstream doesn't set it for the notification controller.
      priorityClassName: system-cluster-critical
      automountServiceAccountToken: false
      (containers[?name == 'manager'] | [0]):
        # The notification controller receives the events, it doesn't send them.
        (args[?starts_with(@, '--events-addr')] | length(@)): 0
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-crd-controller
roleRef:
  name: flux-crd-controller
subjects:
- name: kustomize-controller
  namespace: flux-system
- name: helm-controller
  namespace: flux-system
- name: source-controller
  namespace: flux-system
- name: notification-controller
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-cluster-reconciler
subjects:
- name: kustomize-controller
- name: helm-controller
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress
  namespace: flux-system
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-scraping
  namespace: flux-system
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webhooks
  namespace: flux-system
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: critical-pods
  namespace: flux-system
---
apiVersion: v1
kind: Secret
metadata:
  name: canonical-registry-credentials
  namespace: flux-system
