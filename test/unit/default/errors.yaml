# The image controllers and the source watcher are disabled by default.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-reflector-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-automation-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: source-watcher
---
apiVersion: v1
kind: Service
metadata:
  name: source-watcher
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: artifactgenerators.source.extensions.fluxcd.io
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: imagepolicies.image.toolkit.fluxcd.io
---
# The NetworkPolicy opening the source controller to all namespaces was removed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-source-for-supply-chains
---
# The upstream names of the cluster-wide RBAC are prefixed with `flux-`.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crd-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-reconciler
---
# No additional certificate authorities.
apiVersion: v1
kind: Secret
metadata:
  name: flux-ca-certificates
---
apiVersion: policies.kyverno.io/v1
kind: NamespacedImageValidatingPolicy
