apiVersion: apps/v1
kind: Deployment
metadata:
  name: source-controller
spec:
  template:
    metadata:
      (annotations."prometheus.io/scrape" == null): true
      (annotations."prometheus.io/port" == null): true
    spec:
      (containers[?name == 'manager'] | [0]):
        (contains(args, '--log-level=debug')): true
        # Flux calls the text format `console`.
        (contains(args, '--log-encoding=console')): true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-controller
spec:
  template:
    metadata:
      (annotations."prometheus.io/scrape" == null): true
    spec:
      (containers[?name == 'manager'] | [0]):
        (contains(args, '--log-encoding=console')): true
