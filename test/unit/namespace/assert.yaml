apiVersion: v1
kind: Namespace
metadata:
  name: gitops
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helm-controller
  namespace: gitops
spec:
  template:
    spec:
      (containers[?name == 'manager'] | [0]):
        (contains(args, '--events-addr=http://notification-controller.gitops.svc.cluster.local./')): true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-crd-controller
(subjects[?namespace != 'gitops'] | length(@)): 0
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-cluster-reconciler
(subjects[?namespace != 'gitops'] | length(@)): 0
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress
  namespace: gitops
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: critical-pods
  namespace: gitops
---
apiVersion: v1
kind: Secret
metadata:
  name: canonical-registry-credentials
  namespace: gitops
