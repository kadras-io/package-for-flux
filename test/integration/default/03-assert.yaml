---
# Uninstalling the package keeps the CustomResourceDefinitions, the Flux resources, and the workloads they manage.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kustomizations.kustomize.toolkit.fluxcd.io
---
apiVersion: v1
kind: Namespace
metadata:
  name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podinfo
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo-helm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
status:
  readyReplicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo-helm
status:
  readyReplicas: 1
