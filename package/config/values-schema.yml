#@ load("/lib/validation.star", "is_dns_label")

#@ def image_reflector_enabled(values):
#@   return not values["image_automation_controller"]["enabled"] or values["image_reflector_controller"]["enabled"]
#@ end

#@data/values-schema
#@schema/validation ("`image_reflector_controller.enabled` to be true when `image_automation_controller.enabled` is true, since the image automation controller updates the images selected by its policies", image_reflector_enabled)
---

#@schema/desc "The namespace in which to deploy Flux."
#@schema/validation ("a valid DNS label", is_dns_label), min_len=1, max_len=63
namespace: flux-system

#! =============================================
#! Components
#! =============================================

#@schema/desc "Settings for the source controller, which fetches artifacts from Git repositories, OCI repositories, Helm repositories, and buckets. It's always deployed."
source_controller:
  #@schema/desc "Container flags, merged on top of the ones computed by the package. Set a flag to null to remove it. See https://fluxcd.io/flux/components/source/options/."
  #@schema/examples ("Vertical scaling", {"concurrent": 10, "requeue-dependency": "5s"}), ("Helm index cache", {"helm-cache-max-size": 10, "helm-cache-ttl": "60m", "helm-cache-purge-interval": "5m"})
  #@schema/type any=True
  args: {}

#@schema/desc "Settings for the kustomize controller, which reconciles Kustomizations."
kustomize_controller:
  #@schema/desc "Whether to deploy the kustomize controller."
  enabled: true
  #@schema/desc "Container flags, merged on top of the ones computed by the package. Set a flag to null to remove it. See https://fluxcd.io/flux/components/kustomize/options/."
  #@schema/examples ("Multi-tenancy lockdown", {"no-cross-namespace-refs": True, "no-remote-bases": True, "default-service-account": "default"})
  #@schema/type any=True
  args: {}

#@schema/desc "Settings for the helm controller, which reconciles HelmReleases."
helm_controller:
  #@schema/desc "Whether to deploy the helm controller."
  enabled: true
  #@schema/desc "Container flags, merged on top of the ones computed by the package. Set a flag to null to remove it. See https://fluxcd.io/flux/components/helm/options/."
  #@schema/examples ("Out-of-memory detection", {"feature-gates": "OOMWatch=true"}), ("Multi-tenancy lockdown", {"no-cross-namespace-refs": True, "default-service-account": "default"})
  #@schema/type any=True
  args: {}

#@schema/desc "Settings for the notification controller, which receives the events of the other controllers, forwards them via Alerts, and serves the webhooks of Receivers."
notification_controller:
  #@schema/desc "Whether to deploy the notification controller. When disabled, the other controllers don't send events."
  enabled: true
  #@schema/desc "Container flags, merged on top of the ones computed by the package. Set a flag to null to remove it. See https://fluxcd.io/flux/components/notification/options/."
  #@schema/type any=True
  args: {}

#@schema/desc "Settings for the image reflector controller, which scans container registries for image tags and selects them via ImagePolicies."
image_reflector_controller:
  #@schema/desc "Whether to deploy the image reflector controller."
  enabled: false
  #@schema/desc "Container flags, merged on top of the ones computed by the package. Set a flag to null to remove it. See https://fluxcd.io/flux/components/image/options/."
  #@schema/type any=True
  args: {}

#@schema/desc "Settings for the image automation controller, which commits the images selected by ImagePolicies to Git repositories. It requires the image reflector controller."
image_automation_controller:
  #@schema/desc "Whether to deploy the image automation controller."
  enabled: false
  #@schema/desc "Container flags, merged on top of the ones computed by the package. Set a flag to null to remove it. See https://fluxcd.io/flux/components/image/options/."
  #@schema/type any=True
  args: {}

#@schema/desc "Settings for the source watcher, which composes and transforms artifacts via ArtifactGenerators."
source_watcher:
  #@schema/desc "Whether to deploy the source watcher."
  enabled: false
  #@schema/desc "Container flags, merged on top of the ones computed by the package. Set a flag to null to remove it. It accepts the flags common to the Flux controllers, like `concurrent` and `requeue-dependency`. See https://fluxcd.io/flux/components/source/artifactgenerators/."
  #@schema/type any=True
  args: {}

#! =============================================
#! Trust
#! =============================================

#@schema/desc "PEM-encoded certificates of additional certificate authorities to trust, for example to reach a private Git server, OCI registry, or Helm repository. The system ones are still trusted."
ca_cert_data: ""

#! =============================================
#! Observability
#! =============================================

#@schema/desc "Settings for logs and metrics."
observability:
  logging:
    #@schema/desc "The log level of the controllers."
    #@schema/validation one_of=["error", "info", "debug", "trace"]
    level: info
    #@schema/desc "The format of the logs."
    #@schema/validation one_of=["text", "json"]
    format: json
  metrics:
    #@schema/desc "Whether to annotate the Pods for Prometheus scraping. The controllers always expose metrics on port 8080 (`/metrics`)."
    enabled: true

#! =============================================
#! Policies
#! =============================================

#@schema/desc "Settings for the Kyverno policies."
policies:
  #@schema/desc "Whether to include the Kyverno policies that validate and secure the package installation. They require Kyverno 1.19 or later."
  enabled: false

#! =============================================
#! Proxy
#! =============================================

#@schema/desc "Settings for the corporate proxy, used to reach Git servers, OCI registries, Helm repositories, and notification providers."
proxy:
  #@schema/desc "The HTTP proxy to use for network traffic."
  http_proxy: ""
  #@schema/desc "The HTTPS proxy to use for network traffic."
  https_proxy: ""
  #@schema/desc "A comma-separated list of hostnames, IP addresses, or IP ranges in CIDR format that should not use the proxy. Include the in-cluster domains, since the controllers talk to each other."
  #@schema/examples ("Bypass the proxy for in-cluster traffic", ".cluster.local.,.cluster.local,.svc,10.0.0.0/8")
  no_proxy: ""
