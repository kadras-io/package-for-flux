#@ load("@ytt:overlay", "overlay")
#@ load("/lib/flux.star", "args_merger", "component_args", "enabled_components")

#! Each controller is configured via flags. The ones computed from the package values are merged
#! into the upstream flags, then `<component>.args` is merged on top, so its flags take precedence.
#! See: https://fluxcd.io/flux/installation/configuration/bootstrap-customization/

#@ for component in enabled_components():
#@overlay/match by=overlay.subset({"kind":"Deployment", "metadata":{"name":component.deployment}})
---
spec:
  template:
    spec:
      containers:
        #@overlay/match by="name"
        - name: manager
          #@overlay/replace via=args_merger(component_args(component))
          args:
#@ end
