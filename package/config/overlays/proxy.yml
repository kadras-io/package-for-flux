#@ load("@ytt:data", "data")
#@ load("@ytt:overlay", "overlay")
#@ load("/lib/flux.star", "enabled_components")

#! The controllers reach Git servers, OCI registries, Helm repositories, buckets, and notification providers.
#! See: https://fluxcd.io/flux/installation/configuration/proxy-setting/

#@ proxy = data.values.proxy
#@ env = [{"name": name, "value": value} for name, value in [("HTTP_PROXY", proxy.http_proxy), ("HTTPS_PROXY", proxy.https_proxy), ("NO_PROXY", proxy.no_proxy)] if value]

#@ if env:
#@ for component in enabled_components():
#@overlay/match by=overlay.subset({"kind":"Deployment", "metadata":{"name":component.deployment}})
---
spec:
  template:
    spec:
      containers:
        #@overlay/match by="name"
        - name: manager
          env:
          #@ for var in env:
          - #@ var
          #@ end
#@ end
#@ end
