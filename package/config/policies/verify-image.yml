#@ load("@ytt:data", "data")

#@ if data.values.policies.enabled:
---
apiVersion: policies.kyverno.io/v1
kind: NamespacedImageValidatingPolicy
metadata:
  name: flux-verify-image
  namespace: #@ data.values.namespace
  annotations:
    policies.kyverno.io/title: Verify Image
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.19.0
    policies.kyverno.io/description: >-
      Using the Cosign project, this policy checks all container images used by this package
      to ensure they have been signed by the Flux release workflows on GitHub Actions (keyless signing).
spec:
  webhookConfiguration:
    timeoutSeconds: 30
  #! Image verification only makes sense when Pods are admitted.
  evaluation:
    background:
      enabled: false
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "ghcr.io/fluxcd/*"
    - glob: "docker.io/fluxcd/*"
  attestors:
    - name: cosign
      cosign:
        #! The Flux images are signed with Cosign keyless, from the GitHub workflows of the fluxcd organization,
        #! and their signatures are recorded in the Rekor transparency log.
        #! See: https://fluxcd.io/flux/security/#signed-container-images
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/fluxcd/.*$
        ctlog:
          url: https://rekor.sigstore.dev
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.cosign])).all(e, e > 0)
      message: The Flux images must be signed by the Flux release workflows.
#@ end
